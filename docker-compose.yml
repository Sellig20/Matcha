# docker-compose.yml

volumes: 
  db_data: # This volume will persist your data across container recreations

services: 

  db:
    image: postgres:16 # UPDATED to latest stable PostgreSQL 16
    container_name: db
    restart: always
    tty: true
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
       - db_data:/var/lib/postgresql/data # Mounts the named volume to persist data
    ports:
      - "${POSTGRES_PORT:-5432}:5432" # Use environment variable for host port, default to 5432
    networks:
      - node-network
    # Optional: Add a healthcheck to ensure DB is ready before other services start
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5

  back-end:
    env_file:
      - .env
    depends_on:
        db:
          # condition: service_healthy # Use if healthcheck is defined and PG version supports it well
          condition: service_started # Fallback if no healthcheck
    networks: 
      - node-network
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: back-end
    working_dir: /usr/src/app
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules # Important: Keeps node_modules in the container
    tty: true
    ports:
      - "${BACKEND_PORT:-3000}:3000" # Use environment variable for host port, default to 3000
    command: npm run dev # Or your start command

  front-end:
    depends_on:
      db:
        condition: service_started
    networks: 
      - node-network
    build: 
      context: frontend
    container_name: front-end
    working_dir: /usr/src/app
    volumes: 
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    tty: true
    ports: 
      - "3001:3001"
    command: npm run dev

  nginx:
    build: 
      context: nginx
    container_name: nginx
    restart: always
    tty: true
    ports: 
      - "8000:80"
    networks: 
      - node-network
    depends_on:
       - db
       - back-end
       - front-end

networks: 
  node-network:
    driver: bridge
